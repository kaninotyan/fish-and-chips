<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Fish and Chipos (Nastya)</title>
	<link rel="stylesheet" href="style.css">

<style>

	body{
		margin: auto;
	}
	img{
		max-width: 100%;
	}

	.color{
		width: max-content;
	}

	.swatch{
		width: 2.54cm;
		aspect-ratio: 1;
	}

	.label{
		font-family: monospace;
		border-top: 1px solid #bb5b7e;
		padding-top: 0.5em;
		margin-top: 0.5em;
	}

</style>



</head>
<body>
	<section class="Identite">

		<article class="Logo">
		<h2>Logo</h2>
		<img src="Fichier 1.svg" alt="Logo FishnChips">
		</article>

		<article class="Application">
			<h2>Application</h2>
			<img src="FoodTruck.png" alt="Image du camion">
		</article>

		<article class="web">
			<h2>Maquette de site web</h2>

			<div class="row">
				<div>
					<h3>Page d'accueil</h3>
					<img src="PAGEWEB" alt="maquette web mobile">
				</div>

				<div>
					<h3>Page d'accueil</h3>
					<img src="PAGEWEB" alt="maquette web mobile">
				</div>

				<div>
					<h3>Page d'accueil</h3>
					<img src="PAGEWEB" alt="maquette web mobile">
				</div>
			</div><!-- fin .row -->

			
		</article>

	</section>

	<section id="CharteGraphique">

		<article id="Codecouleur">

			<h1>Couleur</h1>

			<script src="swatches.js"></script>


			<div class="color">
				<h3>"Couleur Principale"</h3>
				<div class="swatch" style="background: var(--couleurPrincipale);"></div>
				<p class="label" data-color-format="hsl"></p>
				<p class="label" data-color-format="rgb"></p>
				<p class="label" data-color-format="hex"></p>
				<p class="label" data-color-format="lab"></p>
				<p class="label" data-color-format="cmyk"></p>
			</div>

			<div class="color">
				<h3>"Couleur Secondaire"</h3>
				<div class="swatch" style="background:var(--couleurSecondaire) ;"></div>
				<p class="label" data-color-format="hsl"></p>
				<p class="label" data-color-format="rgb"></p>
				<p class="label" data-color-format="hex"></p>
				<p class="label" data-color-format="lab"></p>
				<p class="label" data-color-format="cmyk"></p>
			</div>

			<div class="color">
				<h3>Mix</h3>
				<div class="swatch" style="background: color-mix(in srgb, var(--couleurPrincipale), var(--couleurSecondaire));"></div>
				<p class="label" data-color-format="hsl"></p>
				<p class="label" data-color-format="rgb"></p>
				<p class="label" data-color-format="hex"></p>
				<p class="label" data-color-format="lab"></p>
				<p class="label" data-color-format="cmyk"></p>
				
			</div>

			<div class="color">
				<h3>Fiesta Obscure</h3>
				<div class="swatch" style="background-color: hsl( from var(--couleurPrincipale) h s l);"></div>
				<p class="label" data-color-format="hsl"></p>
				<p class="label" data-color-format="rgb"></p>
				<p class="label" data-color-format="hex"></p>
				<p class="label" data-color-format="lab"></p>
				<p class="label" data-color-format="cmyk"></p>
			</div>



		</article>
		<!-- Couleur -->

	</section>
	<!-- #CharteGraphique -->
</body>
</html>
